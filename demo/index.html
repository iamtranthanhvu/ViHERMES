<title>ViHERMES – Hỏi đáp quy định y tế</title>
<style>
  :root {
    --bg: #ffffff; --side: #f7f8f7; --ink: #14181a; --muted: #6a7570; --line: #e6eae8;
    --bubble: #f1f3f2; --hover: #eceeed; --card: #ffffff; --accent: #0f9a78; --accent-soft: #e5f5f0;
    --accent-ink: #ffffff; --send: #0f9a78; --shadow: 0 1px 2px rgba(20,30,25,.06), 0 8px 24px rgba(20,30,25,.06);
    --glow: radial-gradient(60% 50% at 50% 0%, rgba(15,154,120,.10), transparent 70%);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1f1e; --side: #151918; --ink: #ebf0ee; --muted: #9aa7a1; --line: #2c3532;
      --bubble: #272e2c; --hover: #232a28; --card: #222927; --accent: #2fcf9e; --accent-soft: #1c332c;
      --accent-ink: #0b1411; --send: #2fcf9e; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
      --glow: radial-gradient(60% 50% at 50% 0%, rgba(47,207,158,.12), transparent 70%);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1f1e; --side: #151918; --ink: #ebf0ee; --muted: #9aa7a1; --line: #2c3532;
    --bubble: #272e2c; --hover: #232a28; --card: #222927; --accent: #2fcf9e; --accent-soft: #1c332c;
    --accent-ink: #0b1411; --send: #2fcf9e; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --glow: radial-gradient(60% 50% at 50% 0%, rgba(47,207,158,.12), transparent 70%);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
    font: 16px/1.7 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  button { font: inherit; color: inherit; }
  ::selection { background: var(--accent-soft); }
  ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px;
    border: 3px solid transparent; background-clip: content-box; }
  .app { display: grid; grid-template-columns: 272px 1fr; height: 100vh; height: 100dvh; }
  svg { display: block; }

  .logo { width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center; color: #fff;
    background: linear-gradient(135deg, #19b88f, #0b7d62); box-shadow: 0 2px 8px rgba(15,154,120,.35); }
  .logo svg { width: 18px; height: 18px; }

  /* sidebar */
  aside { background: var(--side); display: flex; flex-direction: column; padding: 14px 12px; min-height: 0;
    border-right: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; font-weight: 650; font-size: 17px;
    letter-spacing: -.01em; }
  .newchat { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--bg);
    border: 1px solid var(--line); padding: 10px 12px; border-radius: 12px; cursor: pointer; font-size: 15px;
    transition: background .15s, border-color .15s; }
  .newchat:hover { background: var(--hover); }
  .newchat svg { width: 18px; height: 18px; color: var(--accent); }
  .hist { flex: 1; overflow-y: auto; margin-top: 18px; min-height: 0; }
  .hist h3 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 8px 10px 6px; letter-spacing: .02em; }
  .hist button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 9px 10px;
    border-radius: 10px; cursor: pointer; font-size: 14px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; color: var(--ink); }
  .hist button:hover { background: var(--hover); }
  .hist button.active { background: var(--accent-soft); }
  .demo { font-size: 11.5px; color: var(--muted); padding: 10px 8px 2px; border-top: 1px solid var(--line); }

  /* main */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; background: var(--bg); }
  main::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 360px; background: var(--glow);
    pointer-events: none; }
  .top { display: flex; align-items: center; gap: 10px; padding: 12px 18px; position: relative; z-index: 1; }
  .top .title { font-weight: 650; }
  .top .sub { color: var(--muted); font-size: 14px; }
  .sp { flex: 1; }
  .icon { background: none; border: 0; width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: grid;
    place-items: center; color: var(--muted); }
  .icon:hover { background: var(--hover); color: var(--ink); }
  .icon svg { width: 20px; height: 20px; }
  .menu { display: none; }
  .scroll { flex: 1; overflow-y: auto; min-height: 0; position: relative; z-index: 1; }
  .col { max-width: 760px; margin: 0 auto; padding: 8px 20px 24px; }

  .welcome { min-height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 8px 20px 40px; animation: rise .5s ease both; }
  .welcome .logo { width: 56px; height: 56px; border-radius: 17px; margin-bottom: 20px; }
  .welcome .logo svg { width: 32px; height: 32px; }
  .welcome h1 { font-size: 30px; margin: 0 0 8px; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; }
  .welcome p { margin: 0 0 28px; color: var(--muted); max-width: 460px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 740px; }
  .card { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 16px; cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--accent); }
  .card .tag { display: block; font-size: 12px; font-weight: 650; color: var(--accent); margin-bottom: 4px;
    letter-spacing: .01em; }
  .card .qt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    font-size: 14.5px; line-height: 1.5; color: var(--ink); }
  .more { margin-top: 18px; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 14px;
    padding: 6px 12px; border-radius: 999px; }
  .more:hover { color: var(--ink); background: var(--hover); }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .msg { padding: 14px 0; animation: rise .3s ease both; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble { background: var(--bubble); padding: 10px 18px; border-radius: 22px 22px 6px 22px;
    max-width: 82%; overflow-wrap: anywhere; white-space: pre-wrap; line-height: 1.6; }
  .msg.bot { display: flex; gap: 14px; }
  .msg.bot .logo { margin-top: 2px; width: 30px; height: 30px; }
  .body { flex: 1; min-width: 0; }
  .body p { margin: 0 0 12px; overflow-wrap: anywhere; }
  .body p.soft { color: var(--muted); font-size: 15px; }
  .caret::after { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); margin-left: 4px; vertical-align: middle; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(.55); opacity: .5; } }

  .think { display: flex; flex-direction: column; gap: 6px; font-size: 15px; padding: 2px 0 6px; }
  .think div { display: flex; align-items: center; gap: 10px; color: var(--muted); animation: rise .25s ease both; }
  .think .tick { width: 16px; height: 16px; color: var(--accent); flex: none; }
  .think .spin { width: 14px; height: 14px; margin: 1px; border-radius: 50%; border: 2px solid var(--line);
    border-top-color: var(--accent); animation: spin .7s linear infinite; flex: none; }
  .think .now { color: var(--ink); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .srchead { display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 4px 0;
    cursor: pointer; color: var(--muted); font-size: 13.5px; font-weight: 600; margin-top: 2px; }
  .srchead:hover { color: var(--ink); }
  .srchead svg { width: 16px; height: 16px; }
  .srchead .chev { transition: transform .2s; } .srchead.shut .chev { transform: rotate(-90deg); }
  .srcs { display: grid; gap: 10px; margin: 6px 0 12px; animation: rise .35s ease both; }
  .srcs.shut { display: none; }
  .src { display: flex; gap: 12px; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
    background: var(--card); font-size: 14px; line-height: 1.55; }
  .src .num { width: 22px; height: 22px; border-radius: 7px; background: var(--accent-soft); color: var(--accent);

  .src b { display: block; font-weight: 650; margin-bottom: 3px; }
  .src.plain { align-items: center; } .src.plain b { margin: 0; font-weight: 550; }
  .src span { color: var(--muted); display: block; }
  .src span::before { content: "“"; } .src span::after { content: "”"; }
  .actions { display: flex; gap: 2px; margin-top: 2px; }
  .actions button { background: none; border: 0; border-radius: 8px; padding: 5px 9px; cursor: pointer;
    color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .actions button:hover { background: var(--hover); color: var(--ink); }
  .actions button.on { color: var(--accent); }
  .actions svg { width: 16px; height: 16px; }

  /* composer */
  .composer { padding: 6px 20px 4px; position: relative; z-index: 1; }
  .box { max-width: 760px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 26px;
    display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 20px; box-shadow: var(--shadow);
    transition: border-color .15s; }
  .box:focus-within { border-color: var(--accent); }
  textarea { flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: var(--ink);
    font: inherit; line-height: 1.5; padding: 8px 0; max-height: 160px; }
  textarea::placeholder { color: var(--muted); }
  .go { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--send); color: var(--accent-ink);
    cursor: pointer; display: grid; place-items: center; flex: none; transition: opacity .15s, transform .15s; }
  .go:not(:disabled):hover { transform: scale(1.06); }
  .go:disabled { opacity: .3; cursor: default; }
  .go svg { width: 18px; height: 18px; }
  .note { text-align: center; color: var(--muted); font-size: 12px; padding: 8px 20px 12px; position: relative; z-index: 1; }

  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 auto 0 0; width: 280px; z-index: 5; transform: translateX(-100%);
      transition: transform .2s; }
    .app.open aside { transform: none; box-shadow: 0 0 60px rgba(0,0,0,.35); }
    .menu { display: grid; }
    .cards { grid-template-columns: 1fr; }
    .welcome h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="brand"><span class="logo" data-logo></span> ViHERMES</div>
    <button class="newchat" id="new" data-icon="pen"> Cuộc trò chuyện mới</button>
    <div class="hist" id="hist"></div>
    <div class="demo">Bản demo · dữ liệu mô phỏng</div>
  </aside>
  <main>
    <div class="top">
      <button class="icon menu" id="menu" aria-label="Mở menu" data-icon="menu"></button>
      <span class="title">ViHERMES</span><span class="sub">Hỏi đáp quy định y tế</span>
      <span class="sp"></span>
      <button class="icon" id="theme" aria-label="Đổi giao diện sáng/tối" data-icon="moon"></button>
    </div>
    <div class="scroll" id="scroll"><div id="view"></div></div>
    <div class="composer">
      <form class="box" id="form">
        <textarea id="q" rows="1" maxlength="500" placeholder="Hỏi về quy định y tế…" aria-label="Câu hỏi"></textarea>
        <button class="go" id="go" type="submit" aria-label="Gửi" disabled data-icon="up"></button>
      </form>
    </div>
    <div class="note">ViHERMES tra cứu trong bộ văn bản y tế của dataset và có thể sai. Hãy đối chiếu với văn bản gốc; đây không phải tư vấn pháp lý.</div>
  </main>
</div>

const norm = s => s.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, " ").split(/\s+/).filter(Boolean);
function match(text) {
  const a = new Set(norm(text)); if (!a.size) return null;
  let best = null, score = 0;
  for (const it of ITEMS) {
    const b = new Set(norm(it.question)); let n = 0;
    for (const w of a) if (b.has(w)) n++;
    const s = n / (a.size + b.size - n);
    if (s > score) { score = s; best = it; }
  }
  return score >= 0.5 ? best : null;
}
function resolve(text) {
  if (/^(xin\s*chào|chào|hello|hi|alo)\b/i.test(text.trim()) && norm(text).length <= 4)

  const w = el("div", "welcome");
  const lg = el("span", "logo"); lg.innerHTML = svg("logo"); w.appendChild(lg);
  w.appendChild(el("h1", "", "Bạn muốn tra cứu quy định y tế nào?"));
  w.appendChild(el("p", "", "Hỏi bằng tiếng Việt, mình sẽ trả lời kèm căn cứ trích nguyên văn từ văn bản gốc."));
  const cards = el("div", "cards");
  for (const i of GROUPS[group]) {
    const c = el("button", "card"); c.type = "button";
    c.appendChild(el("span", "tag", TAGS[i])); c.appendChild(el("span", "qt", ITEMS[i].question));
    c.addEventListener("click", () => ask(ITEMS[i].question));
    cards.appendChild(c);
  }
  w.appendChild(cards);
  const more = el("button", "more", "↻  Gợi ý khác"); more.type = "button";
  more.addEventListener("click", () => { group = (group + 1) % GROUPS.length; drawWelcome(); });
  w.appendChild(more);
  view.appendChild(w);
}
function userRow(text) { const m = el("div", "msg user"); m.appendChild(el("div", "bubble", text)); return m; }
function botRow() {
  const m = el("div", "msg bot"); const lg = el("span", "logo"); lg.innerHTML = svg("logo"); m.appendChild(lg);
  const body = el("div", "body"); m.appendChild(body); return [m, body];
}
function sourcesUI(body, list, refused) {
  if (!list || !list.length) return;
  const head = el("button", "srchead"); head.type = "button";
  head.insertAdjacentHTML("afterbegin", svg("doc"));
  head.appendChild(document.createTextNode((refused ? "Văn bản đã tìm thấy · " : "Nguồn · ") + list.length + " văn bản"));
  head.insertAdjacentHTML("beforeend", '<span class="chev" style="display:contents">' + svg("chev") + "</span>");
  const panel = el("div", "srcs");
  list.forEach((s, i) => {
    const d = el("div", refused ? "src plain" : "src"); d.appendChild(el("div", "num", String(i + 1)));
    const t = el("div"); t.appendChild(el("b", "", s.title)); if (!refused) t.appendChild(el("span", "", s.quote));
    d.appendChild(t); panel.appendChild(d);
  });
  head.addEventListener("click", () => { head.classList.toggle("shut"); panel.classList.toggle("shut"); });
  body.append(head, panel);
}
function actionsUI(body, text) {
  const a = el("div", "actions");
  const copy = withIcon(el("button"), "copy", ""); copy.type = "button"; copy.setAttribute("aria-label", "Sao chép");
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(text); copy.replaceChildren(); withIcon(copy, "check", "Đã sao chép"); }
    catch { copy.replaceChildren(); copy.textContent = "Không sao chép được"; }
    setTimeout(() => { copy.replaceChildren(); withIcon(copy, "copy", ""); }, 1500);
  });
  const up = withIcon(el("button"), "up2", ""), down = withIcon(el("button"), "down2", "");
  up.type = down.type = "button";
  up.setAttribute("aria-label", "Câu trả lời hữu ích"); down.setAttribute("aria-label", "Câu trả lời chưa tốt");
  up.addEventListener("click", () => { up.classList.toggle("on"); down.classList.remove("on"); });
  down.addEventListener("click", () => { down.classList.toggle("on"); up.classList.remove("on"); });
  a.append(copy, up, down); body.appendChild(a);
}
async function stream(p, text) {
  const words = text.split(/(\s+)/); p.classList.add("caret");
  for (let i = 0; i < words.length; i++) {
    p.appendChild(document.createTextNode(words[i]));
    if (i % 3 === 0) { toBottom(); await wait(26 + Math.random() * 28); }
  }
  p.classList.remove("caret");
}
async function renderBot(body, item, animate) {
  body.replaceChildren();
  const all = [];
  for (const [text, soft] of paragraphs(item)) {
    const p = el("p", soft ? "soft" : ""); body.appendChild(p); all.push(text);
    if (animate) await stream(p, text); else p.textContent = text;
  }
  sourcesUI(body, item.sources, item.status === "refused"); actionsUI(body, all.join("\n"));
}
function draw() {
  view.replaceChildren(); renderHist();
  if (!cur.msgs.length) { drawWelcome(); return; }
  const col = el("div", "col"); view.appendChild(col);
  for (const m of cur.msgs) {
    if (m.role === "user") col.appendChild(userRow(m.text));
    else { const [row, body] = botRow(); row.style.animation = "none"; col.appendChild(row); renderBot(body, m.item, false); }
  }
  toBottom();
}

async function ask(text) {
  text = text.trim(); if (!text || busy) return;
  busy = true; go.disabled = true; q.value = ""; fit();
  if (!cur.msgs.length) { view.replaceChildren(); view.appendChild(el("div", "col")); }
  const col = view.querySelector(".col");
  if (!cur.msgs.length) cur.title = text;
  cur.msgs.push({ role: "user", text }); col.appendChild(userRow(text)); renderHist();
  const [row, body] = botRow(); col.appendChild(row);
  const think = el("div", "think"); body.appendChild(think); toBottom();
  for (let i = 0; i < STEPS.length; i++) {
    const r = el("div", "now"); r.appendChild(el("i", "spin")); r.appendChild(document.createTextNode(STEPS[i] + "…"));
    think.appendChild(r); toBottom();
    await wait(850 + Math.random() * 600);
    r.className = ""; r.replaceChildren(); r.insertAdjacentHTML("afterbegin", svg("check"));
    r.firstChild.setAttribute("class", "tick"); r.appendChild(document.createTextNode(STEPS[i]));
  }
  await wait(250);
  const item = resolve(text); cur.msgs.push({ role: "bot", item });
  await renderBot(body, item, true);
  busy = false; go.disabled = !q.value.trim(); toBottom(); q.focus();
}

function fit() { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 160) + "px"; }
q.addEventListener("input", () => { fit(); go.disabled = busy || !q.value.trim(); });
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(q.value); } });
$("form").addEventListener("submit", e => { e.preventDefault(); ask(q.value); });
$("new").addEventListener("click", () => {
  if (busy) return; app.classList.remove("open");
  if (cur.msgs.length) { newConv(); draw(); } q.focus();
});
$("menu").addEventListener("click", () => app.classList.toggle("open"));
newConv(); draw();
</script>
</body>
</html>
